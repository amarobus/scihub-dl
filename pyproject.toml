[project]
name = "scihub-dl"
version = "0.1.0"
description = "Small library + CLI to resolve and download papers from Sci-Hub by DOI, with batch support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.23"]

[project.scripts]
scihub-dl = "scihub_dl.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real Sci-Hub network (deselect with '-m \"not live\"')",
]
